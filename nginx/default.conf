# Toutes les instances "app" : Docker renvoie une adresse IP par instance,
# nginx les répartit à tour de rôle (round robin, comportement par défaut).
upstream django {
    zone django 64k;
    server app:8000;
}

server {
    listen 80;

    # Fichiers statiques servis directement par nginx, sans passer par Django
    location /static/ {
        alias /static/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Indique quelle instance a répondu (pratique pour vérifier le load balancing)
        add_header X-Upstream $upstream_addr always;
    }
}