# Passerelle vers TMDB : l'application appelle http://tmdb-gateway/3/...
# Arrêter ce conteneur simule une panne de TMDB, le relancer simule son retour.
server {
    listen 80;

    location / {
        proxy_pass https://api.themoviedb.org;
        proxy_ssl_server_name on;
        proxy_set_header Host api.themoviedb.org;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}