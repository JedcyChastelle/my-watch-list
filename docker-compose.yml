services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Logs PostgreSQL : connexions et requêtes de plus de 200 ms
    command: postgres -c log_connections=on -c log_min_duration_statement=200
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tâche ponctuelle : prépare la base et les fichiers statiques, puis s'arrête.
  # Elle tourne une seule fois, même quand on lance plusieurs instances de "app".
  migrate:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "False"
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    user: root
    volumes:
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "False"
      REDIS_URL: redis://redis:6379/0
      TMDB_BASE_URL: http://tmdb-gateway/3
    volumes:
      - static:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on:
      - app

  redis:
    image: redis:7-alpine

  # Passerelle vers l'API TMDB (voir nginx/tmdb-gateway.conf)
  tmdb-gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/tmdb-gateway.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  static: