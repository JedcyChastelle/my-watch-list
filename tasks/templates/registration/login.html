{% load socialaccount %}
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<div class="container" style="max-width: 400px; margin-top: 60px;">
  <h2>Connexion</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
  </form>

  <hr>

  <form method="post" action="{% provider_login_url 'google' %}">
    {% csrf_token %}
    <button class="btn btn-outline-dark btn-block" type="submit">Se connecter avec Google</button>
  </form>

  <p class="mt-3">Pas encore de compte ? <a href="{% url 'signup' %}">Créer un compte</a></p>
</div>
